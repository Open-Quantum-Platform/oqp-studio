<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OQP Studio 3D</title>
    <link rel="stylesheet" href="/molstar/molstar.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1e24; overflow: hidden; }
      #app { position: absolute; inset: 0; }
      /* Hide Mol* chrome — this page is a pure render surface. */
      .msp-plugin .msp-layout-expanded { border: none; }
      .msp-viewport-controls, .msp-traj-controls { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/molstar/molstar.js"></script>
    <script>
      const DARK_BG = 0x1b1e24;

      function sameOriginHref(value) {
        if (!value) return null;
        const url = new URL(value, window.location.href);
        return url.origin === window.location.origin ? url.href : null;
      }

      async function boot() {
        const viewer = await molstar.Viewer.create("app", {
          layoutIsExpanded: false,
          layoutShowControls: false,
          layoutShowRemoteState: false,
          layoutShowSequence: false,
          layoutShowLog: false,
          layoutShowLeftPanel: false,
          viewportShowExpand: false,
          viewportShowSelectionMode: false,
          viewportShowAnimation: false,
          pdbProvider: "rcsb",
        });

        // Studio look: dark ground, soft ambient occlusion, thin outline.
        const canvas3d = viewer.plugin.canvas3d;
        if (canvas3d) {
          canvas3d.setProps({
            renderer: { backgroundColor: DARK_BG },
            postprocessing: {
              occlusion: {
                name: "on",
                params: {
                  samples: 32, multiScale: { name: "off", params: {} },
                  radius: 5, bias: 0.8, blurKernelSize: 15, blurDepthBias: 0.5,
                  resolutionScale: 1, color: 0x000000,
                },
              },
              outline: {
                name: "on",
                params: { scale: 1, threshold: 0.33, color: 0x000000,
                          includeTransparent: true },
              },
              shadow: { name: "off", params: {} },
            },
          });
        }

        // Keep this viewer alive across previews: reloading the page would
        // re-download Mol* and rebuild the WebGL context on every edit, which
        // is what made updating the structure feel slow.
        // The default matches how the app has always looked; the other
        // choices are additive.
        let style = { type: "auto", color: "element-symbol", labels: "none" };
        let last = null;   // { data, format }

        // Mol* labels an element with its atom name, and there is no parameter
        // to make it print an index instead. An XYZ model has no atom names,
        // so numbering is done by rewriting the coordinates as a small PDB
        // whose atom names are the numbers themselves.
        function numberedPdb(xyz) {
          const lines = xyz.split("\n");
          const count = parseInt(lines[0], 10);
          if (!Number.isFinite(count) || count < 1 || count > 9999) return null;
          const rows = [];
          for (let i = 0; i < count; i += 1) {
            const parts = (lines[i + 2] || "").trim().split(/\s+/);
            if (parts.length < 4) return null;
            const [element, x, y, z] = parts;
            const name = String(i + 1);
            // Fixed-width PDB columns: serial 7-11, name 13-16, resName
            // 18-20, chain 22, resSeq 23-26, x/y/z 31-54, element 77-78. A
            // single column out of place moves every atom.
            rows.push(
              "HETATM" +                                  // 1-6
              String(i + 1).padStart(5) +                  // 7-11
              " " +                                       // 12
              name.padEnd(4).slice(0, 4) +                 // 13-16
              " " +                                       // 17 altLoc
              "UNL" +                                     // 18-20
              " " +                                       // 21
              "A" +                                       // 22 chain
              "   1" +                                    // 23-26 resSeq
              " " +                                       // 27 iCode
              "   " +                                     // 28-30
              Number(x).toFixed(3).padStart(8) +           // 31-38
              Number(y).toFixed(3).padStart(8) +           // 39-46
              Number(z).toFixed(3).padStart(8) +           // 47-54
              "  1.00" +                                  // 55-60
              "  0.00" +                                  // 61-66
              "          " +                              // 67-76
              element.toUpperCase().padStart(2),           // 77-78
            );
          }
          rows.push("END");
          return rows.join("\n");
        }

        // Numbers ride on a second, invisible model rather than replacing the
        // first: the XYZ model keeps the bonding Mol* derives for it, and the
        // numbered copy contributes nothing but its labels.
        async function addNumberLabels(xyz) {
          const pdb = numberedPdb(xyz);
          if (!pdb) return;
          const plugin = viewer.plugin;
          const raw = await plugin.builders.data.rawData({ data: pdb });
          const trajectory = await plugin.builders.structure.parseTrajectory(raw, "pdb");
          const model = await plugin.builders.structure.createModel(trajectory);
          const structure = await plugin.builders.structure.createStructure(model);
          const component = await plugin.builders.structure.tryCreateComponentStatic(
            structure, "all",
          );
          if (!component) return;
          await plugin.builders.structure.representation.addRepresentation(component, {
            type: "label",
            typeParams: {
              level: "element",
              attachment: "middle-center",
              sizeFactor: 0.55,
              backgroundOpacity: 0.4,
              borderWidth: 0.1,
            },
          });
        }

        async function drawStructure(data, format = "xyz") {
          last = { data, format };
          // "auto" hands over to Mol*'s own preset, which draws proteins and
          // nucleic acids as cartoons with ligands in ball-and-stick.
          if (style.type === "auto") {
            await viewer.loadStructureFromData(data, format);
            if (style.labels === "atom-id" && format === "xyz") await addNumberLabels(data);
            return;
          }
          const plugin = viewer.plugin;
          const raw = await plugin.builders.data.rawData({ data });
          const trajectory = await plugin.builders.structure.parseTrajectory(raw, format);
          const model = await plugin.builders.structure.createModel(trajectory);
          const structure = await plugin.builders.structure.createStructure(model);
          const component = await plugin.builders.structure.tryCreateComponentStatic(
            structure, "all",
          );
          if (!component) return;
          await plugin.builders.structure.representation.addRepresentation(component, {
            type: style.type === "auto" ? "ball-and-stick" : style.type,
            color: style.color,
            typeParams: style.type === "spacefill" ? { ignoreLight: false } : {},
          });
          if (style.labels === "element-symbol") {
            await plugin.builders.structure.representation.addRepresentation(component, {
              type: "label",
              typeParams: {
                level: "element",
                attachment: "middle-center",
                sizeFactor: 0.55,
                backgroundOpacity: 0.4,
                borderWidth: 0.1,
              },
            });
          } else if (style.labels === "atom-id" && format === "xyz") {
            await addNumberLabels(data);
          }
        }

        // Orbital appearance, in the spirit of MacMolPlt and IQmol: a phase
        // colour pair, an opacity, and solid or mesh surfaces.
        let orbital = { positive: 0x4f8fdd, negative: 0xdd6a4f, alpha: 0.85, visuals: ["solid"] };

        const isoSurfaces = (iso) => [
          { type: "absolute", value: iso, color: orbital.positive, alpha: orbital.alpha },
          { type: "absolute", value: -iso, color: orbital.negative, alpha: orbital.alpha },
        ];

        // loadVolumeFromUrl sets colour and opacity but not the visual kind, so
        // the created representations are updated in place afterwards.
        //
        // tryUseGpu:false is what keeps the surface smooth. Mol*'s GPU
        // marching cubes uploads the volume as a byte texture, and quantizing
        // the field to 256 levels puts a visible orange-peel ripple on every
        // lobe; the CPU path reads the full-precision grid.
        async function applyOrbitalVisuals() {
          const plugin = viewer.plugin;
          const update = plugin.state.data.build();
          let touched = false;
          plugin.state.data.cells.forEach((cell, ref) => {
            // Skip cells the state has already dropped: a redraw can race with
            // this update and the stale reference would throw.
            if (!cell.obj || cell.status !== "ok") return;
            if (!(cell.transform?.transformer?.id || "").includes("volume-representation-3d")) return;
            touched = true;
            update.to(ref).update((old) => ({
              ...old,
              type: {
                ...old.type,
                params: {
                  ...old.type.params,
                  alpha: orbital.alpha,
                  visuals: orbital.visuals,
                  tryUseGpu: false,
                },
              },
            }));
          });
          if (!touched) return;
          try {
            await update.commit();
          } catch (error) {
            console.warn("orbital restyle skipped:", error);
          }
        }

        function setRendering(options) {
          const canvas3d = viewer.plugin.canvas3d;
          if (!canvas3d) return;
          const post = {};
          if ("occlusion" in options) {
            post.occlusion = options.occlusion
              ? { name: "on", params: {
                    samples: 32, multiScale: { name: "off", params: {} },
                    radius: 5, bias: 0.8, blurKernelSize: 15, blurDepthBias: 0.5,
                    resolutionScale: 1, color: 0x000000 } }
              : { name: "off", params: {} };
          }
          if ("outline" in options) {
            post.outline = options.outline
              ? { name: "on", params: { scale: 1, threshold: 0.33, color: 0x000000,
                                        includeTransparent: true } }
              : { name: "off", params: {} };
          }
          const props = {};
          if (Object.keys(post).length) props.postprocessing = post;
          if ("background" in options) {
            props.renderer = { backgroundColor: options.background };
          }
          canvas3d.setProps(props);
        }

        // ---- measurements -------------------------------------------------
        // Clicking atoms measures them, the way MacMolPlt and Avogadro do:
        // two atoms give a bond length, three an angle, four a dihedral.
        // A fifth click starts a new measurement.
        const S = molstar.lib.structure;
        const picked = [];

        function report(value) {
          window.parent.postMessage({
            type: "oqp-measure",
            labels: picked.map((p) => p.label),
            kind: value?.kind ?? null,
            value: value?.value ?? null,
            unit: value?.unit ?? null,
          }, window.location.origin);
        }

        function atomFromLoci(loci) {
          const location = S.StructureElement.Loci.getFirstLocation(loci);
          if (!location) return null;
          const atom = S.StructureProperties.atom;
          const symbol = atom.type_symbol(location) || atom.label_atom_id(location) || "?";
          return {
            label: `${symbol}${atom.id(location)}`,
            position: [atom.x(location), atom.y(location), atom.z(location)],
          };
        }

        const sub = (p, q) => [p[0] - q[0], p[1] - q[1], p[2] - q[2]];
        const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
        const cross = (p, q) => [p[1] * q[2] - p[2] * q[1],
                                 p[2] * q[0] - p[0] * q[2],
                                 p[0] * q[1] - p[1] * q[0]];
        const norm = (p) => Math.sqrt(dot(p, p));

        function measure() {
          const [a, b, c, d] = picked.map((p) => p.position);
          if (picked.length === 2) {
            return { kind: "Bond length", value: norm(sub(a, b)), unit: "Å" };
          }
          if (picked.length === 3) {
            const u = sub(a, b), v = sub(c, b);
            const cosine = dot(u, v) / (norm(u) * norm(v));
            return { kind: "Angle",
                     value: Math.acos(Math.max(-1, Math.min(1, cosine))) * 180 / Math.PI,
                     unit: "°" };
          }
          if (picked.length === 4) {
            const b1 = sub(b, a), b2 = sub(c, b), b3 = sub(d, c);
            const n1 = cross(b1, b2), n2 = cross(b2, b3);
            const unit2 = b2.map((v) => v / norm(b2));
            const m = cross(n1, unit2);
            return { kind: "Dihedral",
                     value: Math.atan2(dot(m, n2), dot(n1, n2)) * 180 / Math.PI,
                     unit: "°" };
          }
          return null;
        }

        window.oqpPlugin = viewer.plugin;   // handy for diagnostics
        window.oqpViewer = viewer;

        // Mol*'s stock click behaviours re-frame the camera on every pick,
        // which would throw the view around while atoms are being measured.
        // Measuring is what clicking means in this app, so they are removed.
        (async () => {
          const CAMERA_ON_CLICK = ["ms-plugin.camera-focus-loci",
                                   "ms-plugin.representation-focus-loci"];
          const state = viewer.plugin.state.behaviors;
          const update = state.build();
          let touched = false;
          state.cells.forEach((cell, ref) => {
            if (CAMERA_ON_CLICK.includes(cell.transform?.transformer?.id)) {
              touched = true;
              update.delete(ref);
            }
          });
          if (touched) await update.commit().catch(() => {});
        })();
        viewer.plugin.behaviors.interaction.click.subscribe(({ current, button }) => {
          const loci = current?.loci;
          // Clicking empty space clears the current measurement.
          if (!loci || loci.kind !== "element-loci") {
            picked.length = 0;
            report();
            return;
          }
          const atom = atomFromLoci(loci);
          if (!atom) return;
          if (picked.length >= 4) picked.length = 0;
          picked.push(atom);
          report(measure());
        });

        window.addEventListener("message", async (event) => {
          if (event.origin !== window.location.origin) return;
          const message = event.data || {};
          if (message.type === "oqp-structure") {
            picked.length = 0;
            report();
            await viewer.plugin.clear();
            await drawStructure(message.xyz);
          } else if (message.type === "oqp-file") {
            await viewer.plugin.clear();
            await drawStructure(message.text, message.format);
          } else if (message.type === "oqp-orbital-style") {
            orbital = { ...orbital, ...message.orbital };
            await applyOrbitalVisuals();
          } else if (message.type === "oqp-rendering") {
            setRendering(message.rendering || {});
          } else if (message.type === "oqp-style") {
            style = { ...style, ...message.style };
            if (last) {
              await viewer.plugin.clear();
              await drawStructure(last.data, last.format);
            }
          } else if (message.type === "oqp-snapshot") {
            // Mol* draws into its own WebGL canvas, so the image has to come
            // from the plugin rather than from a screenshot of the DOM.
            let image = null;
            try {
              image = await viewer.plugin.helpers.viewportScreenshot.getImageDataUri();
            } catch (error) {
              console.warn("snapshot failed:", error);
            }
            window.parent.postMessage({ type: "oqp-snapshot-data", image },
                                      window.location.origin);
          } else if (message.type === "oqp-measure-clear") {
            picked.length = 0;
            report();
          } else if (message.type === "oqp-cube") {
            await viewer.plugin.clear();
            if (message.xyz) await drawStructure(message.xyz);
            const url = sameOriginHref(message.cube);
            if (url) {
              await viewer.loadVolumeFromUrl(
                { url, format: "cube", isBinary: false },
                isoSurfaces(Math.abs(message.iso) || 0.05),
              );
              await applyOrbitalVisuals();
            }
          }
        });
        window.parent.postMessage({ type: "oqp-viewer-ready" }, window.location.origin);

        const params = new URLSearchParams(window.location.search);
        const sameOrigin = sameOriginHref;

        const load = params.get("load");
        if (load) {
          const href = sameOrigin(load);
          if (href) await viewer.loadStructureFromUrl(href, "xyz", false);
        }

        // Multi-frame XYZ (normal-mode trajectory) played as an animation.
        const traj = params.get("traj");
        if (traj) {
          const href = sameOrigin(traj);
          if (href) {
            // A multi-model XYZ loads as a trajectory with full representations.
            await viewer.loadStructureFromUrl(href, "xyz", false);
            const plugin = viewer.plugin;
            plugin.managers.animation.play(
              plugin.managers.animation.animations.find(
                (a) => a.name === "built-in.animate-model-index"
              ),
              { mode: { name: "loop", params: { direction: "forward" } },
                duration: { name: "fixed", params: { durationInS: 2 } } }
            );
          }
        }

        // Orbital / density isosurfaces from a Gaussian cube file.
        const cube = params.get("cube");
        if (cube) {
          const href = sameOrigin(cube);
          const iso = Math.abs(parseFloat(params.get("iso") || "0.05")) || 0.05;
          if (href) {
            await viewer.loadVolumeFromUrl(
              { url: href, format: "cube", isBinary: false },
              isoSurfaces(iso),
            );
            await applyOrbitalVisuals();
          }
        }
      }
      boot();
    </script>
  </body>
</html>
