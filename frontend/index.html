<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OQP Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16181d;
        --panel: #1e2128;
        --text: #d7dae0;
        --accent: #5aa9e6;
        --border: #2c313a;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, sans-serif;
      }
      header {
        padding: 0.7rem 1.2rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        padding: 1rem;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
      }
      textarea, pre {
        width: 100%;
        min-height: 16rem;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-sizing: border-box;
        padding: 0.6rem;
        font-family: ui-monospace, monospace;
        overflow: auto;
      }
      button {
        background: var(--accent);
        color: #0c1116;
        border: 0;
        border-radius: 6px;
        padding: 0.5rem 1.2rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.6rem;
      }
      #status { margin-left: 0.8rem; opacity: 0.8; }
      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.45rem 0.6rem;
        margin-left: 0.6rem;
      }
      #files { padding-left: 1.2rem; }
      #files a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      OQP Studio <small style="opacity:.6">Phase 0 preview</small>
      <a href="/viewer/index.html" target="_blank"
         style="float:right;color:var(--accent);text-decoration:none">Results Viewer ↗</a>
    </header>
    <main>
      <section>
        <h3>Input (.oqp)</h3>
        <textarea id="input" spellcheck="false"></textarea>
        <div>
          <button id="run">Run</button>
          <select id="runner" title="Execution backend"></select>
          <span id="status"></span>
        </div>
      </section>
      <section>
        <h3>Log</h3>
        <pre id="log"></pre>
        <h3>Output files</h3>
        <ul id="files"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
