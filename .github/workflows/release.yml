name: Release installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (e.g. v0.1.0); leave empty to only build artifacts"
        required: false
        default: ""
      openqp_windows_ref:
        description: "OpenQP ref for the Windows engine (default: the PR that adds Windows support)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The installer people download in the normal case: small, quick to build,
  # and it fetches the engine when the user first asks for one.
  installers:
    uses: ./.github/workflows/installers.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

  # The same installer with the engine inside it, so one download installs an
  # application that computes -- no second step, and nothing fetched at run
  # time.  It waits for the engine builds, which is why it lands last.
  installers-with-engine:
    needs: [engine-linux, engine-macos, engine-windows]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    uses: ./.github/workflows/installers.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      with_engine: true

  # `pip install oqp-studio` — the distribution channel that matches this
  # audience, since OpenQP itself is installed with pip/conda.
  python-package:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wheel and sdist
        working-directory: backend
        run: |
          pip install build
          python build_wheel.py

      - name: Verify the wheel serves the UI
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install backend/dist/*.whl
          cd /tmp
          /tmp/check/bin/python -m uvicorn oqp_studio.main:app --port 8821 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8821/api/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8821/ -o /dev/null
          curl -sf http://127.0.0.1:8821/viewer/index.html -o /dev/null
          echo "wheel serves the UI and viewer"

      - uses: actions/upload-artifact@v4
        with:
          name: oqp-studio-python
          path: backend/dist/*
          if-no-files-found: error

      - name: Attach the wheel to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: backend/dist/*

      # Publishes only when a PyPI token is configured; without it the job
      # still builds and attaches the wheel to the GitHub release.
      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: backend
        run: |
          pip install twine
          twine upload --non-interactive \
            -u __token__ -p "$PYPI_API_TOKEN" dist/*

  # The compute engine, attached to the same release as the app.
  #
  # These take hours where the installers take minutes, so they run as their
  # own jobs: the installers appear on the release page first and the engine
  # archives follow. They are called rather than left to their own
  # `release: published` trigger, because a release created by this workflow's
  # GITHUB_TOKEN does not raise events — that trigger only fires for a release
  # a person publishes by hand.
  #
  # Each archive is also a standalone download: unzip and run ./openqp, no GUI
  # and no Python involved.
  engine-linux:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    uses: ./.github/workflows/linux-bundle.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  engine-macos:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    uses: ./.github/workflows/macos-bundle.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  # Windows is the platform most of our users are on, so its engine is built
  # like every other one.  Its support -- Intel ifx/icx with MKL ILP64, the
  # DFT-D4 DLLs installed beside liboqp.dll instead of an RPATH -- is OpenQP
  # #359, merged as d452be6 but not yet in a release tag, and the other four
  # platforms build the latest TAG.  So this job pins that merge commit: on
  # main's history, immutable, and what the next tag will contain.  The day
  # OpenQP releases a tag carrying #359, delete the `openqp_ref:` line and this
  # job is identical to the other four.
  engine-windows:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    uses: ./.github/workflows/windows-bundle.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      openqp_ref: ${{ inputs.openqp_windows_ref || 'd452be6832d48e34cc07fe3149b3ea515aec9d86' }}
