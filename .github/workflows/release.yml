name: Release installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: macos-15-intel
            bundles: dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libfuse2

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend sidecar binary
        shell: bash
        working-directory: backend
        run: |
          pip install -e . rdkit pyinstaller
          python build_binary.py

      - name: Stage sidecar with target triple
        shell: bash
        run: |
          TRIPLE=$(rustc -Vv | grep '^host:' | cut -d' ' -f2)
          mkdir -p shell/src-tauri/binaries
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          cp "backend/dist/oqp-studio-backend${EXT}" \
             "shell/src-tauri/binaries/oqp-studio-backend-${TRIPLE}${EXT}"

      # Signing is optional: with no secrets configured the build produces
      # unsigned installers exactly as before. Adding the secrets below makes
      # Tauri sign (and, for macOS, notarize) automatically.
      #   macOS  : APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #            APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID and either
      #            APPLE_ID + APPLE_APP_PASSWORD (app-specific) or an
      #            App Store Connect API key.
      #   Windows: WINDOWS_SIGN_COMMAND, a command that signs "%1" using a
      #            cloud signing service (Azure Trusted Signing, DigiCert
      #            KeyLocker, SSL.com eSigner); OV certificates have required
      #            hardware/HSM storage since 2023, so a plain .pfx in CI is
      #            no longer an option.
      - name: Enable Windows signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        working-directory: shell/src-tauri
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open("tauri.conf.json"))
          config["bundle"].setdefault("windows", {})["signCommand"] = os.environ["WINDOWS_SIGN_COMMAND"]
          json.dump(config, open("tauri.conf.json", "w"), indent=2)
          print("windows signCommand enabled")
          PY

      - name: Build installers
        shell: bash
        working-directory: shell/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset secret arrives as an empty string, and Tauri treats a
          # defined-but-empty APPLE_CERTIFICATE as "signing requested" and
          # fails importing it. Drop the whole group unless a certificate is
          # actually configured.
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                  APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}

      # Quarantine (and therefore the Gatekeeper block on unsigned apps) is
      # applied by browsers, not by curl. A plain tarball installed from the
      # terminal opens with no warning and no certificate.
      - name: Package .app as a curl-installable tarball
        if: runner.os == 'macOS'
        shell: bash
        working-directory: shell/src-tauri/target/release/bundle/macos
        run: tar czf "OQP-Studio-${{ matrix.os }}.app.tar.gz" "OQP Studio.app"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: oqp-studio-${{ matrix.os }}
          path: |
            shell/src-tauri/target/release/bundle/**/*.dmg
            shell/src-tauri/target/release/bundle/**/*.AppImage
            shell/src-tauri/target/release/bundle/**/*.deb
            shell/src-tauri/target/release/bundle/**/*.msi
            shell/src-tauri/target/release/bundle/**/*.exe
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shell/src-tauri/target/release/bundle/**/*.dmg
            shell/src-tauri/target/release/bundle/**/*.AppImage
            shell/src-tauri/target/release/bundle/**/*.deb
            shell/src-tauri/target/release/bundle/**/*.msi
            shell/src-tauri/target/release/bundle/**/*.exe
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz

  # `pip install oqp-studio` — the distribution channel that matches this
  # audience, since OpenQP itself is installed with pip/conda.
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wheel and sdist
        working-directory: backend
        run: |
          pip install build
          python build_wheel.py

      - name: Verify the wheel serves the UI
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install backend/dist/*.whl
          cd /tmp
          /tmp/check/bin/python -m uvicorn oqp_studio.main:app --port 8821 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8821/api/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8821/ -o /dev/null
          curl -sf http://127.0.0.1:8821/viewer/index.html -o /dev/null
          echo "wheel serves the UI and viewer"

      - uses: actions/upload-artifact@v4
        with:
          name: oqp-studio-python
          path: backend/dist/*
          if-no-files-found: error
