name: macOS standalone bundle
# Builds a self-contained macOS distribution: unzip and run ./openqp.
# No Python, no Homebrew, no compiler on the user's machine -- the archive
# carries the interpreter, liboqp.dylib, the DFT-D4 dylibs, the GCC Fortran
# runtime and the basis-set data.  Meant to be shipped inside the GUI app so an
# ordinary user gets one download that runs immediately.
#
# External ddX links BLAS itself, so this archive carries an ILP64 OpenBLAS
# rather than Accelerate's interposed ILP64 interface.
on:
  # Weekly, so a broken engine build surfaces within days rather than at the
  # next app release, and on demand.  A published OQP Studio release rebuilds
  # and attaches the archives it ships with.
  schedule:
    - cron: "0 3 * * 0"   # Sundays, 03:00 UTC
  workflow_dispatch:
    inputs:
      openqp_ref:
        description: "OpenQP tag to build (default: its latest release)"
        required: false
        type: string
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: "Attach the archive to this already-published release"
        required: false
        type: string
      openqp_ref:
        description: "OpenQP tag to build (default: its latest release)"
        required: false
        type: string

# `gh release upload` needs write access to contents, and the default workflow
# token is read-only.  This is the only write these workflows do -- the archive
# is attached to an already-published release, nothing else is touched.
permissions:
  contents: write

jobs:
  bundle:
    name: openqp-macos-${{ matrix.arch }} (standalone)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel
    env:
      # 13.3 is the floor for OUR code (Accelerate's ILP64 interface), but the
      # archive also carries Homebrew's prebuilt GCC runtime, and a deployment
      # target cannot retarget an already-compiled dylib.  Measured on a real
      # bundle, libgomp and libstdc++ from gcc@15 declare minos 15.0, so 15.0
      # is what this archive actually requires -- the same value the wheels
      # use, for the same reason.  The step after the build verifies it rather
      # than trusting this comment.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      # This repository carries the build script and the composite action the
      # steps below use, so it has to be on disk; the engine is checked out
      # separately, into openqp/.
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Resolve OpenQP's latest release
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This repository ships the desktop application; the compute engine
          # is a separate project.  Build a released engine, never a moving
          # branch: whatever a user runs from this archive should be a version
          # OpenQP itself has verified and tagged.
          tag="${{ inputs.openqp_ref }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo Open-Quantum-Platform/openqp --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building OpenQP $tag"

      - name: Check out OpenQP
        uses: actions/checkout@v4
        with:
          repository: Open-Quantum-Platform/openqp
          ref: ${{ steps.engine.outputs.tag }}
          path: openqp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the Fortran toolchain
        run: brew install gcc@15

      - name: Cache bundled externals
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/openqp/externals
            ~/Library/Caches/openqp/openblas-ilp64
          key: oqp-bundle-externals-macos-${{ matrix.arch }}-openblas-0.3.30-${{ hashFiles('openqp/external/CMakeLists.txt', 'openqp/CMakeLists.txt') }}
          restore-keys: |
            oqp-bundle-externals-macos-${{ matrix.arch }}-

      - name: Build ILP64 OpenBLAS for ddX
        run: |
          set -euo pipefail
          root="$HOME/Library/Caches/openqp/openblas-ilp64/${{ matrix.arch }}"
          if [ ! -f "$root/lib/pkgconfig/openblas64.pc" ]; then
            rm -rf /tmp/OpenBLAS
            git clone --depth 1 --branch v0.3.30 https://github.com/OpenMathLib/OpenBLAS.git /tmp/OpenBLAS
            make -C /tmp/OpenBLAS -j"$(sysctl -n hw.ncpu)" \
              INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 libs netlib shared
            make -C /tmp/OpenBLAS PREFIX="$root" INTERFACE64=1 USE_OPENMP=1 \
              DYNAMIC_ARCH=1 NO_STATIC=1 install
          fi
          test -f "$root/lib/pkgconfig/openblas64.pc"
          echo "OQP_OPENBLAS_ROOT=$root" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build and install OpenQP
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja numpy cffi scikit-build-core pyinstaller
          python -m pip install -v ./openqp --no-build-isolation \
            --config-settings=cmake.define.CMAKE_C_COMPILER=gcc-15 \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER=g++-15 \
            --config-settings=cmake.define.CMAKE_Fortran_COMPILER=gfortran-15 \
            --config-settings=cmake.define.LINALG_LIB=OpenBLAS \
            --config-settings=cmake.define.ENABLE_MPI=OFF \
            --config-settings=cmake.define.ENABLE_DDX=ON \
            --config-settings=cmake.define.USE_LIBINT=OFF \
            --config-settings=cmake.define.ENABLE_OPENTRAH=OFF \
            --config-settings=cmake.define.BUILD_TESTING=OFF
          python -m pip install scipy "numpy<2.2" basis_set_exchange geometric

      - name: Freeze into a standalone directory
        run: |
          # `import oqp` prints "Failed to import mpi4py" on a non-MPI build,
          # so take only the last line -- the path.
          pkg=$(python -c "import os, oqp; print(os.path.dirname(oqp.__file__))" | tail -n1)
          echo "package: $pkg"

          mkdir -p /tmp/oqpwork
          cat > /tmp/oqpwork/openqp_entry.py <<'PY'
          import sys
          from oqp.pyoqp import main
          if __name__ == "__main__":
              sys.exit(main())
          PY

          # liboqp and the DFT-D4 dylibs are opened through cffi at run time and
          # are invisible to PyInstaller's static analysis; add them by name.
          # The GCC Fortran runtime and ILP64 OpenBLAS come from the build
          # environment and must travel too -- the user has neither.
          add=()
          for d in "$pkg"/lib/*.dylib; do add+=(--add-binary "$d:oqp/lib"); done
          for d in "$OQP_OPENBLAS_ROOT"/lib/libopenblas*.dylib; do
            [ -e "$d" ] && add+=(--add-binary "$d:oqp/lib")
          done
          # ddX is an external continuum-solvent library until OpenQP's native
          # implementation is merged.  It may live in the CMake build tree
          # rather than the installed Python package, so discover it explicitly.
          ddx=$(find "$pkg/lib" "$PWD/openqp" "$HOME/Library/Caches/openqp/externals" \
            -type f -name 'libddx*.dylib' -print -quit)
          if [ -z "$ddx" ]; then
            echo "external ddX was enabled but libddx was not built"
            exit 1
          fi
          case "$ddx" in
            "$pkg"/lib/*) ;;
            *) add+=(--add-binary "$ddx:oqp/lib");;
          esac
          gccdir=$(brew --prefix gcc@15)/lib/gcc/current
          for name in libgfortran.5.dylib libquadmath.0.dylib libgcc_s.1.1.dylib libstdc++.6.dylib; do
            if [ -f "$gccdir/$name" ]; then add+=(--add-binary "$gccdir/$name:oqp/lib"); else echo "not found: $name"; fi
          done
          printf 'bundling: %s\n' "${add[@]}" | head -40

          python -m PyInstaller --noconfirm --clean --onedir --name openqp \
            --distpath /tmp/oqpdist --workpath /tmp/oqpwork --specpath /tmp/oqpwork \
            --collect-data oqp --collect-submodules oqp \
            --collect-data basis_set_exchange --collect-submodules basis_set_exchange \
            --collect-data geometric --collect-submodules geometric \
            --collect-submodules scipy --collect-submodules numpy \
            --recursive-copy-metadata basis_set_exchange \
            --copy-metadata OpenQP --copy-metadata geometric \
            "${add[@]}" /tmp/oqpwork/openqp_entry.py

      - name: Add the data tree and a README
        run: |
          ver=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('openqp/pyproject.toml').read_text())['project']['version'])")
          echo "OQP_VERSION=$ver" >> "$GITHUB_ENV"
          engine_sha=$(git -C openqp rev-parse HEAD)
          root=/tmp/oqpdist/openqp
          find "$root" -type f -name 'libddx*.dylib' -print -quit | grep -q . || {
            echo "frozen bundle is missing external ddX"
            exit 1
          }
          pkg=$(python -c "import os, oqp; print(os.path.dirname(oqp.__file__))" | tail -n1)
          cp -R "$pkg/share" "$root/share"
          cp -R openqp/examples "$root/examples"
          cat > "$root/README.txt" <<EOF
          OpenQP for macOS -- standalone build
          ====================================

          Nothing to install.  Unzip anywhere and run, for example:

              ./openqp examples/HF/H2O_RHF-HF_ENERGY.inp

          Results are written next to the input file (.log, .json).

          Threads: set OMP_NUM_THREADS to the number of physical cores, e.g.

              OMP_NUM_THREADS=8 ./openqp myjob.inp

          Requires macOS 15 or newer.  The bundle carries its own Python, the
          GCC Fortran runtime, DFT-D4 and external ddX continuum-solvent
          libraries; that runtime is built for macOS 15, which sets the floor.
          ddX remains bundled until OpenQP's native continuum solver is merged.
          Linear algebra uses the bundled ILP64 OpenBLAS runtime.

          If macOS refuses to run it because it was downloaded from the
          internet, clear the quarantine flag once:

              xattr -dr com.apple.quarantine /path/to/openqp

          OpenQP version : $ver
          OpenQP release : ${{ steps.engine.outputs.tag }}
          OpenQP commit  : $engine_sha
          Architecture   : ${{ matrix.arch }}
          Built          : $(date -u '+%Y-%m-%d %H:%M:%S') UTC
          Built by       : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          tail -6 "$root/README.txt"

      - name: Verify the advertised macOS floor
        run: |
          # Every Mach-O in the archive, including the prebuilt Homebrew
          # runtime, must load on the version the README advertises.  The
          # smoke test cannot catch this: it runs on the newest macOS.
          python3 - "$MACOSX_DEPLOYMENT_TARGET" <<'PY'
          import pathlib, re, subprocess, sys

          floor = tuple(int(part) for part in sys.argv[1].split("."))
          worst, offenders = floor, []
          for path in pathlib.Path("/tmp/oqpdist/openqp").rglob("*"):
              if not path.is_file():
                  continue
              out = subprocess.run(["otool", "-l", str(path)],
                                   capture_output=True, text=True).stdout
              match = re.search(r"^\s*minos\s+([0-9.]+)\s*$", out, re.MULTILINE)
              if not match:
                  continue
              minos = tuple(int(part) for part in match.group(1).split("."))
              worst = max(worst, minos)
              if minos > floor:
                  offenders.append(f"{match.group(1)}  {path.name}")
          if offenders:
              print("\n".join(sorted(set(offenders))))
              raise SystemExit(
                  f"bundle requires macOS {'.'.join(map(str, worst))}, "
                  f"but advertises {'.'.join(map(str, floor))}"
              )
          print(f"every bundled binary loads on macOS {'.'.join(map(str, floor))}")
          PY

      - name: Smoke test the bundle in a clean environment
        run: |
          mkdir -p /tmp/oqpsmoke
          cp openqp/examples/HF/H2O_RHF-HF_ENERGY.inp /tmp/oqpsmoke/hf.inp
          cd /tmp/oqpsmoke
          # No Homebrew, no pyenv, no DYLD_* overrides: exactly what a user has.
          env -i PATH=/usr/bin:/bin HOME="$HOME" OMP_NUM_THREADS=2 \
            /tmp/oqpdist/openqp/openqp hf.inp --nompi
          grep "TOTAL energy" hf.log
          grep -q -- "-76\.01074651" hf.log || { echo "energy does not match the reference"; exit 1; }
          cp openqp/examples/PCM/H2O_RHF-HF_DDPCM_ENERGY_ISPHER.inp /tmp/oqpsmoke/pcm.inp
          env -i PATH=/usr/bin:/bin HOME="$HOME" OMP_NUM_THREADS=2 \
            /tmp/oqpdist/openqp/openqp pcm.inp --nompi
          grep "TOTAL energy" pcm.log
          ! grep -q "without OQP_ENABLE_DDX" pcm.log

      - name: Zip the bundle
        run: |
          # Always a released engine, so the version alone names it; the
          # README inside records the tag, the engine commit and the run.
          zip="openqp-${OQP_VERSION}-macos-${{ matrix.arch }}.zip"
          # -y keeps symlinks as symlinks; the frameworks inside rely on them.
          ( cd /tmp/oqpdist/openqp && zip -qry "$OLDPWD/$zip" . )
          echo "BUNDLE_ZIP=$zip" >> "$GITHUB_ENV"
          ls -lh "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: openqp-macos-${{ matrix.arch }}-standalone
          path: ${{ env.BUNDLE_ZIP }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" "$BUNDLE_ZIP" --clobber
