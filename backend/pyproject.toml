[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oqp-studio-backend"
version = "0.1.0"
description = "Local backend for OQP Studio: runs and monitors OpenQP jobs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.scripts]
oqp-studio = "oqp_studio.desktop:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]
chem = [
    "rdkit>=2023.9",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["oqp_studio*"]

[tool.ruff]
line-length = 100
